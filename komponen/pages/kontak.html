        <header class="site-header">
            <a class="brand" href="../index.html">
                REZZKY
                <span>

            </a>
            <button class="menu-toggle">
                ☰

            <nav class="nav">

        </header>
        <main>
            <section class="page-intro">
                <p class="eyebrow">
                    CONTACT US
                </p>
                <h1>
                    Konsultasi Upgrade PC
                </h1>
                <p>
                    Ceritakan spesifikasi PC dan komponen yang ingin kamu upgrade.
                </p>
            </section>
            <section class="section">
                <div class="contact-wrap">
                    <form class="contact-form" id="contactForm">
                        <input id="customerName" placeholder="Nama kamu" required="" type="text"/>
                        <input id="pcSpec" placeholder="Spesifikasi PC saat ini" required="" type="text"/>
                        <select id="need" required="">
                            <option value="">
                                Pilih kebutuhan upgrade
                            </option>
                            <option>
                                GPU / VGA
                            </option>
                            <option>
                                Processor / CPU
                            </option>
                            <option>
                                RAM
                            </option>
                            <option>
                                SSD / Storage
                            </option>
                            <option>
                                Konsultasi keseluruhan PC
                            </option>
                        </select>
                        <textarea id="message" placeholder="Ceritakan kebutuhan atau anggaran kamu..." required="">
                                                </textarea>
                        <button class="btn" type="submit">
                            Kirim melalui WhatsApp
                        </button>
                    </form>
                </div>
            </section>
        </main>
        <footer>
            <strong>
                REZZKY UPGRADE PC
